// ── Configurações da sessão ────────────────────────────────────────────────
// Tudo que antes exigia SQL ou curl: nome, auto-start, tratamento de grupos e
// webhook (destino, eventos e chave). O PATCH faz merge no servidor, então
// mexer num campo não zera os outros.
const EVT=[
  ['message','mensagens recebidas'],
  ['message.ack','confirmações de entrega'],
  ['session.status','mudanças de conexão'],
]
// Filtros de chat. O default de `status` é IGNORAR (stories não são conversa);
// os outros três nascem recebidos, para não mudar em silêncio o que os canais
// ativos já entregam.
const FLT=[
  ['groups','grupos','mensagens de grupo',false],
  ['status','status','stories dos contatos',true],
  ['channels','canais','canais e newsletters',false],
  ['broadcast','transmissões','listas de transmissão',false],
]
function settings(name){
  const s=sess.find(x=>x.name===name); if(!s)return
  const wh=s.config?.webhooks?.[0]
  const evOn=new Set(wh?.events||EVT.map(e=>e[0]))
  const ig=s.config?.ignore||{}
  // undefined = usa o default do filtro (não "recebido").
  const igOf=k=>{const d=FLT.find(f=>f[0]===k)[3]; return ig[k]===undefined?d:!!ig[k]}
  const rt=wh?.retries||{}
  // X-Webhook-Key tem campo próprio; os outros vão na tabela de cabeçalhos.
  const extras=(wh?.customHeaders||[]).filter(h=>h.name!=='X-Webhook-Key')
  const masked=(wh?.customHeaders||[]).some(h=>h.value==='••••••••')

  const o=modal(`<div class="md-h"><b>configurar</b>
   <span style="color:var(--t1)">${esc(s.label||s.name)}</span>
   <div class="sp"></div><button id="x">fechar</button></div>
   <div class="md-b">
     <div class="blk">
       <div class="sec">identificação</div>
       <div class="fd" style="margin-bottom:0">
         <label for="cnm">nome</label>
         <input id="cnm" value="${esc(s.label||s.name)}" autocomplete="off">
         <p class="fd-h">Livre — espaços, acentos, emoji. O id técnico
           (<span style="color:var(--t2)">${esc(s.name)}</span>) não muda.</p>
       </div>
     </div>

     <div class="blk">
       <div class="sec">comportamento</div>
       <label class="sw">
         <input type="checkbox" id="cas"${s.shouldStart?' checked':''}>
         <span class="sw-b"></span>
         <span class="sw-t">iniciar junto com o serviço
           <u>reconecta sozinha depois de um reinício do gateway</u></span>
       </label>
     </div>

     <div class="blk">
       <div class="sec">o que ignorar</div>
       <div class="flt">
         ${FLT.map(([k,rot,exp])=>`<label class="sw">
           <input type="checkbox" class="cflt" data-k="${k}"${igOf(k)?' checked':''}>
           <span class="sw-b"></span>
           <span class="sw-t">${rot}<u>${exp}</u></span>
         </label>`).join('')}
       </div>
       <p class="fd-h">Marcado = não repassa ao destino. Stories vêm ignorados
         por padrão; grupos, canais e transmissões vêm recebidos.</p>
     </div>

     <div class="blk" style="margin-bottom:0">
       <div class="sec">webhook</div>
       <div class="fd">
         <label for="cwh">destino</label>
         <input id="cwh" value="${esc(wh?.url||'')}"
           placeholder="https://…/webhook/zap" autocomplete="off">
         <p class="fd-h">Para onde enviar o que chega. Em branco, o gateway
           recebe mas não repassa.</p>
       </div>
       <div class="fd">
         <label>eventos enviados</label>
         <div class="evb">
           ${EVT.map(([k,d])=>`<label title="${esc(d)}">
             <input type="checkbox" class="cev" value="${k}"${evOn.has(k)?' checked':''}>
             <span class="bx"></span>${k}</label>`).join('')}
         </div>
       </div>
       <div class="fd">
         <label for="cky">chave de autenticação</label>
         <input id="cky" type="password" placeholder="${masked?'•••••••• (mantém a atual)':'gere uma chave própria'}"
           autocomplete="new-password">
         <p class="fd-h">Vai no header <span style="color:var(--t2)">X-Webhook-Key</span>.
           Em branco, mantém a que já está gravada.</p>
         ${s.webhookUsesMasterKey?`<p class="fd-h" style="color:var(--amb);margin-top:6px">
           Esta sessão autentica o webhook com a <b>chave do gateway</b> — a mesma que
           cria sessão, lê QR e baixa o backup. Quem recebe o webhook fica com controle
           total. <button type="button" id="ckg">gerar chave só para isto</button></p>`:''}
       </div>
       <div class="fd">
         <label>reentrega em caso de falha</label>
         <div class="stp-r">
           <div>
             <div class="stp-l">tentativas</div>
             <div class="stp" data-stp>
               <button type="button" data-d="-1">−</button>
               <input id="cra" type="number" min="1" max="60" value="${rt.attempts??15}">
               <button type="button" data-d="1">+</button>
             </div>
           </div>
           <div>
             <div class="stp-l">intervalo (s)</div>
             <div class="stp" data-stp>
               <button type="button" data-d="-1">−</button>
               <input id="crd" type="number" min="0" max="300" value="${rt.delaySeconds??2}">
               <button type="button" data-d="1">+</button>
             </div>
           </div>
         </div>
         <p class="fd-h">Se o destino estiver fora do ar (um deploy, por exemplo),
           o evento é retentado neste ritmo antes de ser considerado perdido.</p>
       </div>
       <div class="fd" style="margin-bottom:0">
         <label>cabeçalhos extras</label>
         <div class="hdr" id="chd">
           ${extras.map(h=>hdrRow(h.name,h.value)).join('')}
         </div>
         <button type="button" class="tb-a hdr-add" id="cha">+ cabeçalho</button>
         <p class="fd-h">Além do X-Webhook-Key. Úteis quando o destino fica atrás
           de um proxy que exige identificação própria.</p>
       </div>
       <div class="fd-e" id="cer"></div>
     </div>
   </div>
   <div class="md-a">
     <button id="cc">cancelar</button><div class="sp"></div>
     <button id="cs" class="k">salvar</button>
   </div>`,true)

  const close=()=>o.remove()
  o.querySelector('#x').onclick=close
  o.querySelector('#cc').onclick=close
  o.querySelector('#cnm').focus()

  // Stepper: clique nos botões respeitando min/max do próprio input.
  o.querySelectorAll('[data-stp]').forEach(w=>{
    const inp=w.querySelector('input')
    w.querySelectorAll('button').forEach(b=>{b.onclick=()=>{
      const d=+b.dataset.d, min=+inp.min, max=+inp.max
      inp.value=Math.min(max,Math.max(min,(+inp.value||0)+d))
    }})
  })

  // Cabeçalhos extras: linhas adicionáveis/removíveis.
  const hd=o.querySelector('#chd')
  const wire=r=>{r.querySelector('button').onclick=()=>r.remove()}
  hd.querySelectorAll('.hdr-r').forEach(wire)
  o.querySelector('#cha').onclick=()=>{
    hd.insertAdjacentHTML('beforeend',hdrRow('',''))
    const r=hd.lastElementChild; wire(r); r.querySelector('input').focus()
  }

  // "gerar chave só para isto": preenche o campo com uma chave aleatória. Só aparece
  // quando a sessão ainda usa a chave mestra do gateway para autenticar o webhook.
  //
  // Gera no NAVEGADOR e mostra em claro de propósito: o operador precisa copiar o
  // valor para configurar o lado que RECEBE o webhook. Uma chave gerada no servidor
  // voltaria mascarada, e ele não teria como saber qual configurar lá.
  const bkg=o.querySelector('#ckg')
  if(bkg)bkg.onclick=()=>{
    const b=new Uint8Array(32); crypto.getRandomValues(b)
    const k=[...b].map(x=>x.toString(16).padStart(2,'0')).join('')
    const inp=o.querySelector('#cky')
    inp.type='text'; inp.value=k; inp.focus(); inp.select()
    toast('ok','chave gerada','copie e configure no destino do webhook')
  }

  o.querySelector('#cs').onclick=async()=>{
    const er=o.querySelector('#cer')
    const btn=o.querySelector('#cs')
    const label=o.querySelector('#cnm').value.trim()
    const url=o.querySelector('#cwh').value.trim()
    const key=o.querySelector('#cky').value.trim()
    const ev=[...o.querySelectorAll('.cev:checked')].map(c=>c.value)
    if(!label){er.textContent='informe um nome';return}
    if(url&&ev.length===0){er.textContent='escolha pelo menos um evento';return}

    // Cabeçalhos: descarta linhas em branco (o operador abriu e não preencheu).
    const hdrs=[...hd.querySelectorAll('.hdr-r')].map(r=>{
      const [a,b]=r.querySelectorAll('input')
      return {name:a.value.trim(),value:b.value}
    }).filter(h=>h.name)
    const bad=hdrs.find(h=>!/^[A-Za-z0-9!#$%&'*+.^_`|~-]+$/.test(h.name))
    if(bad){er.textContent=`cabeçalho inválido: ${bad.name}`;return}

    const ignore={}
    o.querySelectorAll('.cflt').forEach(c=>{
      ignore['ignore'+c.dataset.k[0].toUpperCase()+c.dataset.k.slice(1)]=c.checked
    })

    btn.disabled=true; btn.innerHTML='<span class="spn"></span>'
    try{
      await api(`/api/sessions/${encodeURIComponent(name)}/settings`,{
        method:'PATCH',
        body:JSON.stringify({
          label,
          shouldStart:o.querySelector('#cas').checked,
          ...ignore,
          webhookUrl:url||null,
          webhookEvents:ev,
          webhookHeaders:hdrs,
          webhookRetries:{
            attempts:+o.querySelector('#cra').value||15,
            delaySeconds:+o.querySelector('#crd').value||0,
            policy:'constant',
          },
          ...(key?{webhookKey:key}:{}),
        }),
      })
      close(); toast('ok','configuração salva',label); load()
    }catch(e){
      er.textContent=e.message
      btn.disabled=false; btn.innerHTML='salvar'
    }
  }
}

/** Uma linha da tabela de cabeçalhos extras. */
function hdrRow(nm,vl){
  return `<div class="hdr-r">
    <input placeholder="Nome" value="${esc(nm)}" autocomplete="off" spellcheck="false">
    <input placeholder="Valor" value="${esc(vl)}" autocomplete="off" spellcheck="false">
    <button type="button" title="remover">×</button>
  </div>`
}

// ── Testar canal ───────────────────────────────────────────────────────────
//
// Responde a pergunta que o operador realmente tem depois de escanear o QR: não
// "o socket subiu?" (o status já diz), e sim "a mensagem CHEGA?".
//
// O valor está em mostrar a entrega PROGREDINDO. Um "enviado com sucesso" não
// distingue mensagem entregue de mensagem que saiu e morreu no caminho — e essa
// distinção é exatamente o bug que mais custou neste projeto.
const PASSOS = [
  ['send', 'aceita pelo gateway'],
  ['1', 'enviada ao WhatsApp'],
  ['2', 'entregue no aparelho'],
  ['3', 'lida pelo contato'],
]

function testar(name){
  const s=sess.find(x=>x.name===name); if(!s)return
  // Sugere o próprio número: testar consigo mesmo é o caminho mais rápido e não
  // incomoda ninguém.
  const meu=s.me?.id?String(s.me.id).split('@')[0]:''

  const o=modal(`<div class="md-h"><b>testar canal</b>
   <span style="color:var(--t1)">${esc(s.label||s.name)}</span>
   <div class="sp"></div><button id="x">fechar</button></div>
   <div class="md-b">
     <div class="fd">
       <label for="tn">número de destino</label>
       <input id="tn" value="${esc(meu)}" placeholder="5511999999999" autocomplete="off"
         inputmode="numeric">
       <p class="fd-h">Com país e DDD, só dígitos. O padrão é o próprio número
         desta sessão — testar consigo mesmo não incomoda ninguém.</p>
     </div>
     <div class="fd" style="margin-bottom:0">
       <label for="tm">mensagem</label>
       <input id="tm" value="Teste do ELO" autocomplete="off">
     </div>
     <div class="fd-e" id="ter"></div>
     <div id="tlw"></div>
   </div>
   <div class="md-a">
     <button id="tf">fechar</button><div class="sp"></div>
     <button id="tg" class="k">enviar teste</button>
   </div>`,true)

  const fechar=()=>{ pararEscuta(); o.remove() }
  o.querySelector('#x').onclick=fechar
  o.querySelector('#tf').onclick=fechar
  o.querySelector('#tn').focus()
  o.querySelector('#tg').onclick=()=>enviarTeste(name,o)
}

/** Passo da linha do tempo, com marcador e horário. */
function linhaPasso(id,rot,estado,quando){
  return `<div class="tl-i${estado?' '+estado:''}" data-p="${id}">
    <span class="tl-d"></span>
    <span class="tl-l">${rot}</span>
    <span class="tl-t">${quando||''}</span>
  </div>`
}

// Escuta de ACK em curso: liga os eventos do SSE ao teste aberto.
let escutando=null

function pararEscuta(){
  if(escutando?.timer)clearTimeout(escutando.timer)
  escutando=null
}

/**
 * Chamado pelo stream() a cada evento. Acende o passo correspondente.
 *
 * Casa pelo ID CRU: o msgId do evento e o do envio podem divergir no chatId
 * (@c.us no envio, @lid no recibo) — foi o que já quebrou o casamento de ACK
 * antes. O sufixo é o único componente estável.
 */
function ackDoTeste(ev){
  if(!escutando||ev.kind!=='ack')return
  const msgId=String(ev.detail?.msgId||'')
  if(!msgId.endsWith(escutando.raw))return
  const ack=Number(ev.detail?.ack)
  marcarPasso(String(ack), ack<0?'er':'on')
  if(ack<0){
    resultado('er','<b>Falhou na entrega.</b> A mensagem saiu do gateway mas o '+
      'WhatsApp não confirmou. Número inválido, ou o contato bloqueou este número.')
    pararEscuta()
  }else if(ack>=2){
    const ms=Date.now()-escutando.t0
    resultado('ok',`<b>Canal funcionando.</b> Entregue em ${(ms/1000).toFixed(1)}s. `+
      (ack>=3?'O contato já leu.':'Aguardando leitura.'))
    if(ack>=3)pararEscuta()
  }
}

function marcarPasso(id,estado){
  const el=document.querySelector(`.tl-i[data-p="${id}"]`)
  if(!el||el.classList.contains('on'))return
  el.className=`tl-i ${estado}`
  const t=el.querySelector('.tl-t')
  if(t)t.textContent=new Date().toLocaleTimeString('pt-BR')
}

function resultado(cls,html){
  const w=$('tlw'); if(!w)return
  let r=w.querySelector('.tl-r')
  if(!r){ w.insertAdjacentHTML('beforeend',`<div class="tl-r"></div>`); r=w.querySelector('.tl-r') }
  r.className=`tl-r ${cls}`
  r.innerHTML=html
}

async function enviarTeste(name,o){
  const fone=(o.querySelector('#tn').value||'').replace(/\D/g,'')
  const texto=(o.querySelector('#tm').value||'').trim()
  const er=o.querySelector('#ter')
  const btn=o.querySelector('#tg')
  er.textContent=''

  // Validação local antes de gastar uma ida ao WhatsApp.
  if(fone.length<10||fone.length>15){
    er.textContent='número com país e DDD (10 a 15 dígitos)'
    o.querySelector('#tn').focus(); return
  }
  if(!texto){ er.textContent='escreva uma mensagem'; return }

  btn.disabled=true; btn.innerHTML='<span class="spn"></span>'
  $('tlw').innerHTML=`<div class="tl">${PASSOS.map(([id,rot])=>linhaPasso(id,rot,'','')).join('')}</div>`

  try{
    // ★ Confere se o número TEM WhatsApp antes de enviar. Sem isto, um número
    // errado gera um envio que o WhatsApp aceita e nunca entrega — o operador
    // veria "enviada" e concluiria que o canal está com problema, quando o
    // problema é o número.
    const ex=await api(`/api/contacts/check-exists?phone=${fone}&session=${encodeURIComponent(name)}`)
      .catch(()=>null)
    if(ex&&ex.numberExists===false){
      marcarPasso('send','er')
      resultado('er','<b>Este número não tem WhatsApp.</b> O canal pode estar '+
        'perfeito — confira o número e tente de novo.')
      btn.disabled=false; btn.innerHTML='enviar teste'
      return
    }

    const r=await api('/api/sendText',{
      method:'POST',
      body:JSON.stringify({session:name,chatId:`${fone}@c.us`,text:texto}),
    })
    marcarPasso('send','on')

    const raw=String(r.id||'').split('_').pop()
    escutando={ raw, t0:Date.now() }
    resultado('','Enviada. Aguardando confirmação de entrega do WhatsApp…')

    // Sem confirmação em 45s: o WhatsApp costuma responder em segundos. Além
    // disso, o mais provável é o aparelho do contato estar offline — e dizer
    // isso é mais útil que deixar a tela girando para sempre.
    escutando.timer=setTimeout(()=>{
      if(!escutando)return
      resultado('','<b>Enviada, sem confirmação ainda.</b> O gateway aceitou e '+
        'o WhatsApp não confirmou a entrega em 45s — normalmente significa que o '+
        'aparelho do contato está offline. A entrega acontece quando ele voltar.')
      pararEscuta()
    },45000)
    escutando.timer.unref?.()

    btn.disabled=false; btn.innerHTML='enviar de novo'
  }catch(e){
    marcarPasso('send','er')
    resultado('er',`<b>O gateway recusou o envio.</b> ${esc(e.message)}`)
    btn.disabled=false; btn.innerHTML='enviar teste'
  }
}

// ── Detalhe ────────────────────────────────────────────────────────────────
function detail(name){
  const s=sess.find(x=>x.name===name); if(!s)return
  const k=stats[name]||{sent:0,lids:0}
  const wh=s.config?.webhooks?.[0]
  const a=estado(s)
  const ph=s.me?.id?String(s.me.id).split('@')[0]:null
  const fmt=d=>d?new Date(d).toLocaleString('pt-BR'):'—'
  const nm=s.label||s.name

  const o=modal(`<div class="md-h"><b>sessão</b><span style="color:var(--t1)">${esc(nm)}</span>
   <div class="sp"></div><button id="x">fechar</button></div>
   <div class="md-b">
     <div style="margin-bottom:20px">
       <div class="sec">identificação</div>
       <dl class="dl">
         <div><dt>estado</dt><dd style="color:${a.c}">${a.l}</dd></div>
         <div><dt>número</dt><dd>${ph?esc(fone(ph)):'<span style="color:var(--t4)">sem pareamento</span>'}</dd></div>
         <div><dt>aparelho</dt><dd>${s.me?.pushName?esc(s.me.pushName):'<span style="color:var(--t4)">—</span>'}</dd></div>
         <div><dt>id técnico</dt><dd>${esc(s.name)}</dd></div>
         <div><dt>engine</dt><dd>${esc(s.engine?.engine||'—')}</dd></div>
         <div><dt>auto-start</dt><dd>${s.shouldStart?'sim':'não'}</dd></div>
         <div><dt>criada</dt><dd>${esc(fmt(s.createdAt))}</dd></div>
         <div><dt>atualizada</dt><dd>${esc(fmt(s.updatedAt))}</dd></div>
       </dl>
     </div>

     <div class="blk">
       <div class="sec">atividade</div>
       <div class="mn">
         <div class="mn-c"><div class="mn-v">${nf(k.sent)}</div><div class="mn-l">mensagens</div></div>
         <div class="mn-c"><div class="mn-v">${nf(k.lids)}</div><div class="mn-l">contatos</div></div>
         <div class="mn-c"><div class="mn-v"${s.reconnectAttempts?' style="color:var(--amb)"':''}>${
           s.reconnectAttempts||0}</div><div class="mn-l">reconexões</div></div>
         <div class="mn-c"><div class="mn-v" style="color:${a.c}">${
           s.status==='WORKING'?'on':'—'}</div><div class="mn-l">${esc(a.l)}</div></div>
       </div>
     </div>

     <div class="blk">
       <div class="sec">webhook</div>
       ${wh?`<dl class="dl" style="gap:13px 20px">
         <div class="wide"><dt>destino</dt><dd style="font-size:11px">${esc(wh.url)}</dd></div>
         <div><dt>eventos</dt><dd style="font-size:11px">${esc((wh.events||[]).join(', ')||'todos')}</dd></div>
         <div><dt>retry</dt><dd style="font-size:11px">${wh.retries
           ?`${wh.retries.attempts}× a cada ${wh.retries.delaySeconds}s`:'padrão'}</dd></div>
       </dl>
       <div class="tst-row">
         <button id="tw" class="tb-a">testar destino</button>
         <span id="tr" class="tst-out"><span class="ph">verifica se o destino aceita os eventos</span></span>
       </div>`
       :`<p class="fd-h" style="margin:0">Sem webhook — as mensagens recebidas
         não são repassadas a lugar nenhum.</p>`}
     </div>

     <div class="blk" style="margin-bottom:0">
       <div class="sec">últimos eventos</div>
       <div id="se" style="font-size:11.5px"></div>
     </div>
   </div>
   <div class="md-a">
     <button id="cf">configurar</button>
     ${s.status==='WORKING'?'<button id="tc">testar canal</button>':''}
     <button id="rs">reiniciar</button><div class="sp"></div>
     ${s.status!=='WORKING'?`<button id="qq" class="k">conectar</button>`:''}
   </div>`,true)
  o.querySelector('#x').onclick=()=>o.remove()
  o.querySelector('#rs').onclick=()=>{o.remove();act('restart',name)}
  o.querySelector('#cf').onclick=()=>{o.remove();settings(name)}
  if(o.querySelector('#tc'))o.querySelector('#tc').onclick=()=>{o.remove();testar(name)}
  const qq=o.querySelector('#qq'); if(qq)qq.onclick=()=>{o.remove();qr(name)}

  const tw=o.querySelector('#tw')
  if(tw)tw.onclick=async()=>{
    const out=o.querySelector('#tr')
    out.innerHTML='<span class="spn"></span>'
    try{
      // O teste roda NO SERVIDOR. A versão anterior fazia fetch daqui e batia em
      // CORS ("Failed to fetch"), que parecia webhook quebrado quando era só a
      // política de origem do navegador. Agora a chamada sai de onde os webhooks
      // reais saem, então o resultado é confiável.
      const r=await api(`/api/sessions/${encodeURIComponent(name)}/test-webhook`,{method:'POST'})
      out.innerHTML=r.ok
        ?`<span style="color:var(--sig)">entregue · http ${r.status} · ${r.ms}ms</span>`
        :`<span style="color:var(--red)">${r.status?`http ${r.status}`:'sem resposta'}${
            r.hint?`<u style="display:block;text-decoration:none;color:var(--t3);font-size:10.5px;margin-top:4px">${esc(r.hint)}</u>`:''}</span>`
    }catch(e){out.innerHTML=`<span style="color:var(--red)">falhou · ${esc(e.message)}</span>`}
  }

  const se=o.querySelector('#se')
  const mine=evs.filter(e=>e.session===name).slice(-12).reverse()
  se.innerHTML=mine.length?mine.map(e=>{
    const d=e.detail?Object.entries(e.detail).filter(([,v])=>v!=null&&v!=='')
      .map(([kk,v])=>`${kk} ${String(v).slice(0,40)}`).join('  ·  '):''
    return `<div style="display:grid;grid-template-columns:56px 72px minmax(0,1fr);gap:12px;
      padding:6px 0;border-bottom:1px solid var(--line-2);align-items:baseline">
      <span style="color:var(--t3);font-size:10.5px">${hms(e.ts)}</span>
      <span class="ln-k ${KC[e.kind]||''}">${KL[e.kind]||e.kind}</span>
      <span style="min-width:0;color:${e.level==='error'?'var(--red)':
        e.level==='warn'?'var(--amb)':'var(--t1)'}">${esc(e.message)}${
        d?`<span style="display:block;color:var(--t3);font-size:10px;margin-top:2px">${esc(d)}</span>`:''}</span>
      </div>`}).join('')
   :'<span style="color:var(--t3)">nenhum evento capturado ainda</span>'
}

function boot(){
  shell(); load(); stream()
  if(timer)clearInterval(timer)
  timer=setInterval(load,15000)
}
document.addEventListener('keydown',e=>{
  if(!KEY||e.target.tagName==='INPUT'||document.querySelector('.ov'))return
  if(e.key==='r'||e.key==='R')load(true)
  if(e.key==='1'){view='sessions';shell()}
  if(e.key==='2'){view='events';shell()}
  if(e.key==='n'||e.key==='N'){if(view==='sessions')newSess()}
})
document.documentElement.dataset.theme=localStorage.getItem('zaptheme')||'dark'
if(KEY){boot()}else{login()}
// Depois de pintar a tela: a versão é informativa e não deve atrasar o primeiro
// render nem impedir o login se o /health estiver lento.
loadVersion()
</script>
