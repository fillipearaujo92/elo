<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elo — gateway</title>
<!-- Favicon: viewBox 24 porque o navegador renderiza a 16px, e 24 divide melhor.
     Traco 2.5 (proporcionalmente mais grosso que na tela grande) — em 16px um
     traco fino desaparece. Sem o arco pequeno da versao anterior: naquele tamanho
     ele virava um borrao ao lado da forma, em vez de ler como elo. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='none' stroke='%234ADE80' stroke-width='2.5' stroke-linecap='round'%3E%3Ccircle cx='9' cy='12' r='5.25'/%3E%3Ccircle cx='15' cy='12' r='5.25' opacity='.5'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   ELO — painel do gateway WhatsApp. Identidade própria, sem o DS do consumidor.
   Painel de instrumentos: monoespaçada como face principal, UM acento
   (verde-sinal) reservado ao que está vivo, estado por tipografia e posição
   em vez de semáforo de cores, linhas finas no lugar de cards.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --ink:#0E1012; --ink-2:#171A1E; --ink-3:#1F242A;
  --line:#2E343A; --line-2:#20252A;
  /* Escala MEDIDA contra a tinta (#0E1012): t1 17:1, t2 9.7:1, t3 6:1, t4 3.6:1.
     A versao anterior tinha t4 em 1.8:1 — labels e tabs ficavam ilegiveis. */
  --t1:#F0F2F4; --t2:#B4BAC1; --t3:#8A9199; --t4:#666D75;
  --sig:#4ADE80; --sig-dim:rgba(74,222,128,.11);
  --amb:#D4A24C; --red:#D9605A;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  /* ★ Curva das animações. Estava FALTANDO: três regras já chamavam var(--ease)
     — a entrada da tela de login (lg-in), a transição do switch e o pulso da
     marca — e um var() sem valor invalida a declaração INTEIRA. Resultado: as
     animações simplesmente não existiam (getAnimations() devolvia lista vazia),
     silenciosamente, sem erro no console. Medido no Chrome. */
  --ease:cubic-bezier(.4,0,.2,1);
}
:root[data-theme="light"]{
  --ink:#FAFAF9; --ink-2:#F1F1EF; --ink-3:#E7E7E4;
  --line:#D2D2CE; --line-2:#E4E4E1;
  --t1:#16181A; --t2:#4A4E53; --t3:#6E7378; --t4:#8B9095;
  --sig:#12A150; --sig-dim:rgba(18,161,80,.09);
  --amb:#9A6B14; --red:#B4322C;
}
*{box-sizing:border-box}
html{font-size:13px}
body{margin:0;background:var(--ink);color:var(--t1);font-family:var(--mono);font-size:13px;
  line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  height:100vh;overflow:hidden}
h1,h2,h3,p{margin:0;font-weight:400}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border:3px solid var(--ink)}
::-webkit-scrollbar-thumb:hover{background:var(--t4)}
*:focus-visible{outline:1px solid var(--sig);outline-offset:2px}
a{color:inherit;text-decoration:none}

.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── Topo: uma linha de texto, sem rail nem ícones ─────────────────────── */
.tb{display:flex;align-items:baseline;gap:14px;padding:18px 22px 16px;flex-shrink:0;
  flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tb-id{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t1);
  letter-spacing:.22em;text-transform:uppercase;cursor:default;user-select:none;
  align-self:center}
.tb-id .mk{color:var(--sig);flex-shrink:0}
.tb-id span{font-weight:500}
.tb-nav{display:flex;gap:0;font-size:11px}
.tb-nav button{background:none;border:none;border-bottom:1px solid transparent;color:var(--t2);
  padding:3px 11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
  font-family:inherit;font-size:11px;position:relative}
.tb-nav button:hover{color:var(--t2)}
.tb-nav button.on{color:var(--t1);border-bottom-color:var(--sig)}
.tb-n{position:absolute;top:-3px;right:1px;font-size:9px;color:var(--red);letter-spacing:0}
.tb-sp{flex:1}
.tb-a{font-size:11px;color:var(--t2);letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--line);padding:5px 11px;background:none;cursor:pointer;font-family:inherit}
.tb-a:hover{color:var(--t1);border-color:var(--t4)}
/* Botão de ícone na barra: quadrado, para o rótulo mais longo não empurrar a
   busca e o "+ nova" fora da tela em janela estreita. O que a ação faz vive no
   `title` (com o atalho), em vez de ocupar largura permanente. */
.tb-a.ic{padding:5px 8px;display:inline-flex;align-items:center;justify-content:center;
  min-width:29px;line-height:0}
.tb-a.ic svg{display:block}
/* Gira enquanto carrega — o próprio ícone é o indicador, sem trocar o conteúdo
   do botão (que fazia a barra saltar de largura a cada atualização). */
.tb-a.ic.on svg{animation:sp .8s linear infinite}
.tb-a.ic:disabled{cursor:progress;opacity:.7}
.tb-a.k{color:var(--t1);border-color:var(--t4)}
.tb-lv{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--t3);
  letter-spacing:.1em;text-transform:uppercase}
.tb-lv::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--sig)}
.tb-lv.off{color:var(--t4)}
.tb-lv.off::before{background:var(--red)}
.tb-sr{display:flex;align-items:center;border:1px solid var(--line);height:27px;padding:0 9px}
.tb-sr:focus-within{border-color:var(--t4)}
.tb-sr input{background:none;border:none;outline:none;color:var(--t1);font-family:inherit;
  font-size:11px;width:118px;letter-spacing:.03em}
.tb-sr input::placeholder{color:var(--t4);letter-spacing:.06em;text-transform:uppercase}

.bd{flex:1;overflow-y:auto;min-height:0}

/* ── Régua de sinal: números grandes, separados por filete ─────────────── */
.sig{display:flex;padding:22px 22px 19px;border-bottom:1px solid var(--line);
  flex-wrap:wrap;gap:0 0}
.sg{padding-right:32px;margin-right:32px;border-right:1px solid var(--line-2);cursor:pointer}
.sg:last-child{border-right:none;padding-right:0;margin-right:0;cursor:default}
.sg:hover .sg-l{color:var(--t2)}
.sg.on .sg-l{color:var(--t1)}
.sg.on .sg-v{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.sg-v{font-size:29px;line-height:1;letter-spacing:-.03em}
.sg-v.a{color:var(--sig)} .sg-v.w{color:var(--amb)}
.sg-v.e{color:var(--red)} .sg-v.z{color:var(--t4)}
.sg-l{font-size:10px;color:var(--t2);letter-spacing:.14em;text-transform:uppercase;margin-top:9px}

/* ── Lista de sessões: linha fina, marcador em traço ───────────────────── */
.hd{display:grid;grid-template-columns:26px minmax(0,1fr) 150px 112px 88px 112px;gap:20px;
  padding:12px 22px;border-bottom:1px solid var(--line);align-items:center}
.hd span,.rw>*{min-width:0;overflow:hidden}
.hd span{font-size:10px;color:var(--t3);letter-spacing:.14em;text-transform:uppercase;
  white-space:nowrap;text-overflow:ellipsis}
.hd span.r{text-align:right}
.hd span.s{cursor:pointer;user-select:none}
.hd span.s:hover{color:var(--t2)}
.hd span.s.on{color:var(--t1)}
.rw{display:grid;grid-template-columns:26px minmax(0,1fr) 150px 112px 88px 112px;gap:20px;
  padding:14px 22px;border-bottom:1px solid var(--line-2);align-items:center;cursor:pointer}
.rw:hover{background:var(--ink-2)}
.rw-i{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:7px}
.rw-i::before{content:'';width:2px;height:15px;background:var(--m);flex-shrink:0}
.rw-n{min-width:0}
.rw-n b{display:block;font-size:13.5px;color:var(--t1);font-weight:500;letter-spacing:-.005em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw-n i{display:block;font-style:normal;font-size:10.5px;color:var(--t3);margin-top:3px}
.rw-p{font-size:12px;color:var(--t2);white-space:nowrap}
.rw-p.no{color:var(--t4)}
.rw-s{font-size:11px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.rw-s.a{color:var(--sig)} .rw-s.w{color:var(--amb)}
.rw-s.e{color:var(--red)} .rw-s.z{color:var(--t3)}
.rw-m{font-size:12px;color:var(--t2);text-align:right;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.rw-m em{font-style:normal;color:var(--t3);font-size:10.5px}
.rw-b{display:flex;gap:4px;justify-content:flex-end;flex-wrap:nowrap;overflow:hidden}
.rw-b button{width:29px;height:29px;display:flex;align-items:center;justify-content:center;
  color:var(--t3);border:1px solid transparent;background:none;cursor:pointer;
  flex-shrink:0;padding:0}
.rw-b button:hover:not(:disabled){background:var(--ink-3)}
.rw-b button:hover:not(:disabled){color:var(--t1);border-color:var(--line)}
.rw-b button.k{color:var(--sig)}
.rw-b button.d:hover:not(:disabled){color:var(--red)}
.rw-b button:disabled{opacity:.3;cursor:not-allowed}

/* ── Log: colunas alinhadas, sem trilho ────────────────────────────────── */
.lf{display:flex;padding:16px 22px 14px;border-bottom:1px solid var(--line);
  flex-wrap:wrap;align-items:center;gap:3px}
.lf button{font-size:10.5px;color:var(--t3);padding:5px 11px;letter-spacing:.1em;
  text-transform:uppercase;background:none;border:1px solid transparent;cursor:pointer;
  font-family:inherit}
.lf button:hover{color:var(--t1);border-color:var(--line)}
.lf button.on{color:var(--ink);background:var(--t2);border-color:var(--t2);font-weight:500}
.lf em{margin-left:auto;font-style:normal;font-size:10.5px;color:var(--t3);letter-spacing:.06em}
.ln{display:grid;grid-template-columns:66px 82px 1fr 122px;gap:14px;padding:7px 22px;
  border-bottom:1px solid var(--line-2);align-items:baseline;font-size:12px}
.ln:hover{background:var(--ink-2)}
.ln-t{color:var(--t3);font-size:11px}
.ln-k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--t2);font-weight:500}
.ln-k.in{color:var(--sig)} .ln-k.out{color:var(--t2)}
.ln-k.er{color:var(--red)} .ln-k.wr{color:var(--amb)}
.ln-m{color:var(--t1);min-width:0;word-break:break-word}
.ln-m u{display:block;text-decoration:none;color:var(--t3);font-size:10.5px;margin-top:3px;
  word-break:break-all;line-height:1.55}
.ln-s{color:var(--t3);font-size:10.5px;text-align:right;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ln.error .ln-m{color:var(--red)}
.ln.warn .ln-m{color:var(--amb)}

/* ── Overlay / painel lateral ──────────────────────────────────────────── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;
  justify-content:center;z-index:500;padding:18px;animation:fi .14s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.md{width:100%;max-width:460px;background:var(--ink);border:1px solid var(--line);
  max-height:88vh;display:flex;flex-direction:column;overflow:hidden;animation:up .18s ease}
.md.lg{max-width:680px}
@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.md-h{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);
  flex-shrink:0}
.md-h b{font-size:11px;color:var(--t2);letter-spacing:.16em;text-transform:uppercase;font-weight:400}
.md-h .sp{flex:1}
.md-h button{background:none;border:none;color:var(--t4);cursor:pointer;font-family:inherit;
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px}
.md-h button:hover{color:var(--t1)}
.md-b{padding:20px;overflow-y:auto;flex:1}
.md-a{display:flex;gap:0;padding:14px 20px;border-top:1px solid var(--line);flex-shrink:0}
.md-a .sp{flex:1}
.md-a button{font-size:11px;color:var(--t2);padding:5px 13px;letter-spacing:.1em;
  text-transform:uppercase;border:1px solid transparent;background:none;cursor:pointer;font-family:inherit}
.md-a button:hover{color:var(--t1);border-color:var(--line)}
.md-a button.k{color:var(--ink);background:var(--sig);border-color:var(--sig)}
.md-a button.k:hover{opacity:.88;color:var(--ink)}
.md-a button.d:hover{color:var(--red);border-color:var(--red)}

/* Campos: só régua inferior; o acento aparece no foco */
.fd{margin-bottom:22px}
.fd label{display:block;font-size:10px;color:var(--t3);letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:9px}
.fd input{width:100%;background:var(--ink-2);border:1px solid var(--line);
  border-bottom-width:2px;color:var(--t1);font-family:inherit;font-size:15px;
  padding:9px 11px;outline:none;letter-spacing:-.005em}
.fd input:hover{border-color:var(--t4)}
.fd input:focus{border-color:var(--t4);border-bottom-color:var(--sig);background:var(--ink-3)}
.fd input::placeholder{color:var(--t4);font-size:13px}
.fd-p{display:flex;align-items:baseline;gap:10px;margin-top:11px;font-size:11.5px}
.fd-p b{font-size:10px;color:var(--t3);letter-spacing:.14em;text-transform:uppercase;font-weight:400}
.fd-p i{font-style:normal;color:var(--sig)}
.fd-h{font-size:11px;color:var(--t3);margin-top:9px;line-height:1.65}
.fd-e{font-size:11px;color:var(--red);margin-top:9px;min-height:15px}

/* Detalhe */
.sec{font-size:10px;color:var(--t3);letter-spacing:.14em;text-transform:uppercase;
  margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
/* Pares em DUAS colunas: a versão anterior empilhava tudo e deixava metade da
   largura vazia. Cada par ocupa uma célula, com o rótulo acima do valor. */
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
  gap:13px 20px;font-size:12px}
.dl>div{min-width:0}
.dl dt{color:var(--t3);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  white-space:nowrap;margin-bottom:3px}
.dl dd{margin:0;color:var(--t1);word-break:break-word;line-height:1.4}
/* Par que precisa da linha inteira (URL, lista de eventos). */
.dl .wide{grid-column:1/-1}
/* Blocos do modal. "atividade" (3 números) é bem mais baixo que "webhook"
   (4 campos), então lado a lado deixava a esquerda oca. Empilhados, cada um
   ocupa a largura inteira e o vazio desaparece. */
.blk{min-width:0;margin-bottom:20px}
/* Atividade em régua horizontal: os 3 números usam toda a largura. */
.mn{display:flex;gap:0}
.mn-c{flex:1;min-width:0;padding-right:18px;margin-right:18px;
  border-right:1px solid var(--line-2)}
.mn-c:last-child{border-right:none;padding-right:0;margin-right:0}
.mn-v{font-size:23px;line-height:1;letter-spacing:-.02em}
.mn-l{font-size:9.5px;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
/* Linha do teste de destino: altura RESERVADA, então o modal não salta quando o
   resultado chega. Antes o <span> nascia vazio e tudo se deslocava. */
/* Interruptor: quadrado, com o traço do acento quando ligado — coerente com a
   linguagem de traços do painel, em vez de uma pílula arredondada genérica. */
.sw{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none;padding:3px 0}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw-b{width:34px;height:18px;border:1px solid var(--line);background:var(--ink-2);
  position:relative;flex-shrink:0;transition:border-color .15s,background .15s}
.sw-b::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;
  background:var(--t4);transition:transform .18s var(--ease),background .15s}
.sw input:checked+.sw-b{border-color:var(--sig);background:var(--sig-dim)}
.sw input:checked+.sw-b::after{transform:translateX(16px);background:var(--sig)}
.sw input:focus-visible+.sw-b{outline:1px solid var(--sig);outline-offset:2px}
.sw-t{font-size:12px;color:var(--t1)}
.sw-t u{display:block;text-decoration:none;font-size:10.5px;color:var(--t3);margin-top:2px}
/* Filtros de chat: grade 2x2, cada um com rótulo e explicação curta. */
.flt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:520px){.flt{grid-template-columns:1fr}}
/* Stepper: campo numérico estreito com passo, sem as setas nativas (que somem
   no tema escuro e mudam de tamanho entre navegadores). */
.stp{display:flex;align-items:stretch;border:1px solid var(--line);width:max-content}
.stp button{width:26px;background:var(--ink-2);border:none;color:var(--t2);
  cursor:pointer;font-size:14px;line-height:1;padding:0;font-family:var(--mono)}
.stp button:hover{background:var(--ink-3);color:var(--t1)}
.stp input{width:52px;background:var(--ink);border:none;border-left:1px solid var(--line);
  border-right:1px solid var(--line);color:var(--t1);font-family:var(--mono);
  font-size:12px;text-align:center;padding:6px 0;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0}
.stp input:focus{outline:none;background:var(--ink-3)}
.stp-r{display:flex;gap:18px;flex-wrap:wrap}
.stp-l{font-size:9.5px;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;
  margin-bottom:5px}
/* Cabeçalhos extras: linhas nome/valor removíveis. */
.hdr{display:flex;flex-direction:column;gap:6px}
.hdr-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 26px;gap:6px}
.hdr-r input{width:100%;background:var(--ink-2);border:1px solid var(--line);
  color:var(--t1);font-family:var(--mono);font-size:11.5px;padding:6px 8px}
.hdr-r input:focus{outline:none;border-color:var(--t4);background:var(--ink-3)}
.hdr-r button{background:none;border:1px solid var(--line);color:var(--t4);
  cursor:pointer;font-size:13px;line-height:1;padding:0}
.hdr-r button:hover{border-color:var(--red);color:var(--red)}
.hdr-add{align-self:flex-start;margin-top:2px}
/* Caixas de evento: mesma linguagem, em linha. */
.evb{display:flex;gap:7px;flex-wrap:wrap;margin-top:3px}
.evb label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t2);
  border:1px solid var(--line);padding:5px 9px;cursor:pointer;transition:.12s}
.evb label:hover{border-color:var(--t4);color:var(--t1)}
.evb input{position:absolute;opacity:0;width:0;height:0}
.evb label:has(input:checked){border-color:var(--sig);color:var(--t1);background:var(--sig-dim)}
.evb .bx{width:11px;height:11px;border:1px solid var(--t4);flex-shrink:0;position:relative}
.evb label:has(input:checked) .bx{border-color:var(--sig);background:var(--sig)}
.evb label:has(input:checked) .bx::after{content:'';position:absolute;inset:1.5px;
  border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);
  transform:rotate(-45deg) translate(.5px,-1px)}

.tst-row{display:flex;align-items:center;gap:13px;margin-top:14px;min-height:32px;flex-wrap:wrap}
.tst-out{font-size:11px;min-width:0;flex:1}
.tst-out .ph{color:var(--t4)}

/* QR */
/* Moldura de validade QUADRADA contornando o QR: o traço acompanha a forma do
   código (um círculo cortava os cantos). O container tem 300px, o QR 250px
   centralizado, e o retângulo passa a ~13px da borda do código. O traço "esvazia"
   no sentido horário a partir do topo, como um cronômetro. */
.qrw{position:relative;width:300px;height:300px;margin:0 auto}
.qrr{position:absolute;inset:0}
.qrr rect{fill:none;stroke-width:3}
.qrr .bg{stroke:var(--line-2)}
.qrr .fg{stroke:var(--sig);stroke-linecap:butt;
  transition:stroke-dashoffset .95s linear,stroke .3s}
.qrr .fg.urg{stroke:var(--amb)}
.qr{position:absolute;top:25px;left:25px;width:250px;height:250px;background:#fff;
  padding:11px;display:block}
.qr.stale{opacity:.35;filter:grayscale(1);transition:opacity .3s,filter .3s}
/* Estado conectado: substitui o QR por confirmação, sem o operador precisar
   fechar e reabrir para descobrir se deu certo. */
.qrok{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:var(--ink);animation:okin .35s ease}
@keyframes okin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.qrok svg{color:var(--sig)}
.qrok b{font-size:13px;color:var(--t1);font-weight:500;letter-spacing:.04em}
.qrok span{font-size:11.5px;color:var(--t3);text-align:center;line-height:1.6}
.qrt{font-size:10.5px;color:var(--t3);text-align:center;margin-top:13px;
  letter-spacing:.06em;text-transform:uppercase}
.qrt b{color:var(--t2);font-weight:400;font-variant-numeric:tabular-nums}
.qrt.urg b{color:var(--amb)}
.qr-h{font-size:11px;color:var(--t3);text-align:center;margin-top:14px;line-height:1.7}
.qr-h b{color:var(--t2);font-weight:400}

/* Aviso flutuante */
.ts{position:fixed;bottom:18px;left:22px;z-index:900;display:flex;flex-direction:column;gap:7px}
.tsi{display:flex;align-items:baseline;gap:10px;padding:10px 14px;background:var(--ink-2);
  border:1px solid var(--line);border-left:2px solid var(--sig);font-size:11.5px;
  animation:sl .2s ease;max-width:340px}
@keyframes sl{from{transform:translateX(-8px);opacity:0}to{transform:none;opacity:1}}
.tsi.er{border-left-color:var(--red)}
.tsi b{font-weight:400;color:var(--t1);white-space:nowrap;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase}
.tsi span{color:var(--t2);min-width:0;word-break:break-word}

/* Vazio / carregando */
.emp{padding:70px 22px;text-align:center}
.emp b{display:block;font-size:13px;color:var(--t2);font-weight:400;margin-bottom:8px}
.emp span{font-size:11.5px;color:var(--t3);line-height:1.7;display:block;max-width:44ch;margin:0 auto}
.spn{display:inline-block;width:11px;height:11px;border:1px solid var(--line);
  border-top-color:var(--sig);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.spn.c{display:block;margin:60px auto}

/* Teste de canal: linha do tempo da entrega. Cada passo acende quando o evento
   correspondente chega pelo SSE — é o que mostra a mensagem ACONTECENDO em vez de
   um "enviado" que não diz se chegou. */
.tl{display:flex;flex-direction:column;gap:0;margin-top:16px}
.tl-i{display:flex;align-items:center;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--line-2);font-size:11.5px;color:var(--t4);
  transition:color .2s}
.tl-i:last-child{border-bottom:none}
.tl-i.on{color:var(--t1)}
.tl-i.er{color:var(--red)}
/* Marcador: círculo vazio → preenchido quando o passo acontece. */
.tl-d{width:9px;height:9px;border:1px solid var(--line);border-radius:50%;
  flex-shrink:0;transition:.2s}
.tl-i.on .tl-d{border-color:var(--sig);background:var(--sig)}
.tl-i.er .tl-d{border-color:var(--red);background:var(--red)}
.tl-l{flex:1;min-width:0}
.tl-t{font-family:var(--mono);font-size:10.5px;color:var(--t3);white-space:nowrap}
.tl-i.on .tl-t{color:var(--sig)}
/* Resultado final do teste. */
.tl-r{margin-top:14px;padding:11px 13px;border:1px solid var(--line);
  font-size:11.5px;line-height:1.55;color:var(--t2)}
.tl-r.ok{border-color:var(--sig);color:var(--t1)}
.tl-r.er{border-color:var(--red)}
.tl-r b{color:var(--t1);font-weight:600}

/* Faixa de aviso: o pareamento existe e nunca foi para um backup. Discreta —
   informa e oferece a ação, sem bloquear o painel nem virar modal. */
.wr{display:flex;align-items:center;gap:14px;border:1px solid var(--amb);
  background:color-mix(in srgb, var(--amb) 9%, transparent);
  padding:11px 14px;margin-bottom:16px;font-size:11.5px;color:var(--t1)}
.wr b{color:var(--amb);font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  font-size:10px;white-space:nowrap}
.wr span{flex:1;min-width:0;line-height:1.5;color:var(--t2)}
.wr button{font-size:10.5px;padding:6px 12px;background:none;color:var(--amb);
  border:1px solid var(--amb);cursor:pointer;font-family:inherit;white-space:nowrap;
  letter-spacing:.08em;text-transform:uppercase}
.wr button:hover{background:color-mix(in srgb, var(--amb) 16%, transparent)}
.wr .x{border:none;color:var(--t4);padding:4px 6px;font-size:13px}
.wr .x:hover{background:none;color:var(--t2)}

/* ── Entrada de chave ──────────────────────────────────────────────────────
   A versão anterior era um bloco de 330px alinhado à esquerda, solto no meio da
   tela, com uma LINHA DIVISÓRIA ÓRFÃ: o border-top do .lg-b caía depois da área
   de erro (vazia na maior parte do tempo), então separava o botão de nada.
   Agora é um cartão contido e centrado — a borda delimita a superfície, em vez
   de riscar o meio dela. */
.lg{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
  /* Halo sutil atrás do cartão: dá profundidade sem pesar o fundo. */
  background:
    radial-gradient(ellipse 620px 420px at 50% 42%, var(--sig-dim), transparent 70%),
    var(--ink)}
.lg-c{width:100%;max-width:352px;background:var(--ink-2);border:1px solid var(--line);
  padding:38px 34px 30px;text-align:center;
  /* Entrada suave: a tela é o primeiro contato com o produto. */
  animation:lg-in .3s var(--ease) both}
@keyframes lg-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mk-lg{color:var(--sig);display:block;margin:0 auto 18px}
/* ★ NAO redimensionar por CSS: o SVG e desenhado numa grade 1:1 com o tamanho do
   atributo (viewBox 48 a 48px). Qualquer escala fracionaria joga as coordenadas
   em subpixel e o navegador anti-aliasa a borda inteira — era a causa do
   serrilhado (viewBox 32 exibido a 42px = escala 1,3125, com cx/r/stroke todos
   caindo em fracao de pixel). */
.mk-lg,.mk{flex-shrink:0}
/* ── Pulso da marca ────────────────────────────────────────────────────────
   Os dois elos respiram em CONTRAPONTO (o segundo atrasado meio ciclo): a marca
   é um handshake, e é isso que o gateway faz — um lado chama, o outro responde.

   Anima só `opacity` e `filter`, NUNCA transform/escala: o aviso acima vale
   igual em movimento. Escalar joga cx/r/stroke em subpixel e a logo serrilha
   quadro a quadro — seria o serrilhado de volta, agora animado.

   `will-change:opacity` mantém a camada promovida na GPU; sem isso o Chrome
   repromove a cada ciclo e o traço tremula. Duração longa (2,6s) e amplitude
   curta: é sinal de vida, não chamariz — a tela de entrada fica aberta enquanto
   se digita a chave, e um pulso agressivo cansa em segundos. */
.mk-lg .e1,.mk-lg .e2,.mk .e1,.mk .e2{
  animation:mk-pulso 2.6s var(--ease) infinite;will-change:opacity}
/* O elo 2 nasce a .45 (mais apagado) e vai ao CONTRÁRIO do elo 1: quando um
   recolhe, o outro acende.
   ★ A inversão está no KEYFRAME, não num animation-delay. Tentei primeiro com
   `delay:-1.3s` (meio ciclo de 2.6s) e medi no Chrome: os dois escureciam
   JUNTOS. Como os keyframes são simétricos (0% igual a 100%), deslocar meio
   ciclo devolve a mesma curva — o delay muda a fase, não a direção. Invertendo
   os valores do keyframe o contraponto é real em qualquer instante. */
.mk-lg .e2,.mk .e2{animation-name:mk-pulso-2}
@keyframes mk-pulso{
  0%,100%{opacity:1;filter:drop-shadow(0 0 0 transparent)}
  50%    {opacity:.62;filter:drop-shadow(0 0 3px var(--sig-dim))}}
@keyframes mk-pulso-2{
  0%,100%{opacity:.45;filter:drop-shadow(0 0 0 transparent)}
  50%    {opacity:.9;filter:drop-shadow(0 0 3px var(--sig-dim))}}

/* ── O segundo elo é o SEMÁFORO ────────────────────────────────────────────
   Um canal aguardando QR ou com falha não pode depender de o operador estar na
   aba certa para ser visto. O segundo elo assume a cor do pior estado presente
   (`--amb` aguardando QR, `--red` com falha) e passa a pulsar mais forte.

   `stroke` explícito, não `currentColor`: o elo precisa divergir da marca — é a
   divergência que carrega a informação. `--mk2` cai em currentColor quando não há
   nada a sinalizar, então o estado normal continua sendo a marca intacta.

   Só o elo 2 muda de cor. Pintar os dois transformaria a marca num alarme e
   custaria a identidade; com um elo verde e outro âmbar, a leitura é
   "algo aqui pede atenção", não "o produto está quebrado". */
.mk-lg .e2,.mk .e2{stroke:var(--mk2,currentColor)}
/* Aviso (QR/falha): mais contraste e ciclo mais curto — some no fundo se for
   idêntico ao pulso de repouso. A amplitude sobe até 1, não além: opacidade não
   passa de 1 e o keyframe tem de bater com o que o navegador consegue render. */
.mk-lg.mk-alerta .e2,.mk.mk-alerta .e2{
  animation-name:mk-pulso-alerta;animation-duration:1.5s}
@keyframes mk-pulso-alerta{
  0%,100%{opacity:.5;filter:drop-shadow(0 0 0 transparent)}
  50%    {opacity:1;filter:drop-shadow(0 0 4px var(--mk2,currentColor))}}
/* ── Entrada da marca no login ─────────────────────────────────────────────
   Os dois elos ENTRAM se encontrando: nascem afastados e deslizam até a
   posição final, o segundo com um atraso curto. A marca é um handshake — a
   entrada mostra o handshake acontecendo, em vez de exibir o resultado dele.

   ★ Anima `cx`, o ATRIBUTO de geometria do SVG, e não `transform`. Essa é a
   única forma de mover os elos sem reintroduzir o serrilhado documentado
   acima: `transform` escala/desloca o raster e joga cx/r/stroke em subpixel,
   enquanto animar `cx` redesenha o círculo em coordenada nova — a grade
   continua inteira em qualquer quadro. (Só funciona porque cx é animável por
   CSS em SVG2, o que o Chrome e o Firefox suportam; onde não for, o elo
   simplesmente aparece na posição final, que é o estado correto.)

   `both` para o estado inicial valer ANTES do primeiro quadro: sem isso os
   elos piscam na posição final e só então saltam para a inicial.

   O pulso de repouso (mk-pulso) segue na mesma regra de sempre e assume
   depois — as duas animações não competem, porque uma anima cx e a outra
   opacity/filter. */
.mk-entra .e1{animation:mk-entra-1 .62s var(--ease) both,
  mk-pulso 2.6s var(--ease) .62s infinite}
.mk-entra .e2{animation:mk-entra-2 .62s var(--ease) .1s both,
  mk-pulso-2 2.6s var(--ease) .72s infinite}
@keyframes mk-entra-1{from{cx:4}to{cx:15}}
@keyframes mk-entra-2{from{cx:40}to{cx:29}}
/* Quem pediu menos movimento recebe a marca parada, sem entrada e sem pulso. */
@media (prefers-reduced-motion:reduce){
  .mk-entra .e1,.mk-entra .e2{animation:none}
}

/* ── Glow do quadro seguindo o mouse ──────────────────────────────────────
   Um halo no CONTORNO do cartão, na direção do cursor. Serve de resposta
   tátil na única tela do produto que não tem nada para clicar além de um
   campo — e é onde o operador chega quando algo já deu errado.

   Como é feito, e por que assim: o brilho vive num pseudo-elemento com
   `padding:1px` e uma máscara que recorta o MIOLO, deixando visível apenas a
   moldura de 1px. Um `box-shadow` seguindo o mouse acenderia o cartão inteiro
   (e lavaria o texto); um `border-image` com gradiente não aceita posição
   radial. Assim o gradiente pinta só a borda.

   `--mx/--my` são atualizados por JS (ver `ligarGlow`). O default 50%/0% deixa
   o halo no topo, centrado — a tela abre com a borda já viva, sem esperar o
   primeiro movimento do mouse.

   `transition` na opacidade e não na posição: interpolar --mx faria o halo
   arrastar atrás do cursor com meio segundo de atraso, o que lê como travado.
   A posição acompanha na hora; só o acender/apagar é suave. */
.lg-c{position:relative}
.lg-c::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:radial-gradient(120px circle at var(--mx,50%) var(--my,0%),
    var(--sig) 0%,var(--sig-dim) 38%,transparent 72%);
  /* Recorta o miolo: sobra a moldura. `-webkit-` primeiro para o Safari, que
     ainda não entende `mask-composite:exclude` sem prefixo. */
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
          mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
          mask-composite:exclude;
  opacity:0;transition:opacity .45s var(--ease);pointer-events:none}
.lg-c.glow-on::before{opacity:.85}
@media (prefers-reduced-motion:reduce){
  .lg-c::before{transition:none}
}
.lg-i{font-size:16px;color:var(--t1);letter-spacing:.34em;text-transform:uppercase;
  font-weight:500;
  /* letter-spacing empurra o texto para a direita; o padding compensa e o
     nome fica opticamente centrado. */
  padding-left:.34em}
/* `.lg-s` (o subtítulo "gateway whatsapp") foi REMOVIDO junto com a regra: o nome
   do produto e o desenho da marca já dizem o que é, e a linha repetia em texto o
   que a tela inteira comunica. Regra órfã em CSS é o tipo de coisa que sobrevive
   por anos e faz a próxima pessoa procurar um elemento que não existe. */
/* Versão: dado técnico, discreta. min-height reserva o espaço para a tela não
   SALTAR quando o /health responde depois do primeiro render. */
.lg-v{font-size:9.5px;color:var(--t3);font-family:var(--mono);letter-spacing:.06em;
  margin-top:10px;min-height:12px;opacity:.85}
/* Régua fina separando a marca do formulário — aqui ela separa DUAS coisas. */
.lg-c hr{border:0;border-top:1px solid var(--line-2);margin:26px 0 24px}
/* Formulário alinhado à esquerda dentro do cartão centrado: rótulo e campo
   pedem leitura em linha, não centralização. */
.lg-c .fd{text-align:left;margin-bottom:0}
.lg-c .fd input{text-align:center;letter-spacing:.14em;font-family:var(--mono);
  padding:11px 12px}
.lg-c .fd-e{text-align:center;margin-top:10px}
.lg-b{display:flex;margin-top:18px}
.lg-b button{flex:1;font-size:11px;color:var(--ink);background:var(--sig);
  border:1px solid var(--sig);padding:11px 16px;letter-spacing:.14em;
  text-transform:uppercase;cursor:pointer;font-family:inherit;font-weight:600;
  transition:opacity .15s,transform .1s}
.lg-b button:hover{opacity:.9}
.lg-b button:active{transform:translateY(1px)}
.lg-b button:disabled{opacity:.6;cursor:progress}
/* O .spn padrão usa --sig na borda — invisível sobre o botão, que é --sig. Aqui
   inverte para o tom do fundo escuro do texto. */
.lg-b .spn{border-color:rgba(0,0,0,.25);border-top-color:var(--ink);vertical-align:middle}
/* Rodapé do cartão: diz o que é este serviço, para quem caiu aqui sem contexto. */
.lg-f{font-size:9.5px;color:var(--t3);letter-spacing:.05em;margin-top:22px;line-height:1.6}
/* No cabeçalho a marca vira pilha de duas linhas: nome + versão. */
.tb-idt{display:flex;flex-direction:column;line-height:1.05}
.tb-v{font-size:8.5px;color:var(--t4);font-family:var(--mono);letter-spacing:.08em;
  margin-top:2px}

@media(max-width:800px){
  .hd{display:none}
  .rw{grid-template-columns:1fr auto;gap:8px 14px;padding:14px 16px}
  .rw-i{grid-column:1/-1}
  .rw-p,.rw-m{grid-column:1}
  .rw-s{grid-column:2;text-align:right}
  .rw-b{grid-column:1/-1;justify-content:flex-start;margin-top:6px}
  .sig{gap:20px;padding:18px 16px}
  .sg{padding-right:0;margin-right:0;border-right:none;min-width:42%}
  .ln{grid-template-columns:1fr;gap:3px}
  .ln-s{text-align:left}
  .tb,.lf{padding-left:16px;padding-right:16px}
  .ts{left:12px;right:12px;bottom:12px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<body>
<div id="app"></div>
<div class="ts" id="ts"></div>

<script>
let KEY=sessionStorage.getItem('zapkey')||''
let sess=[], stats={}, evs=[], view='sessions'
// Estado do backup do pareamento. Vem do /api/backup/status.
let bkp=null
// Dispensar é por SESSÃO do navegador, não permanente: o risco continua real, e
// silenciar para sempre transformaria o aviso em nada.
let bkpOff=sessionStorage.getItem('elo-bkp-off')==='1'
// Versão do gateway. Vem do /health — endpoint PÚBLICO, então pode ser lida
// antes do login (aparece já na tela da chave).
const VER={v:null,c:null}
function verLabel(){
  // Commit só entra quando existe (build local não passa COMMIT_SHA).
  return VER.c?`v${VER.v} · ${VER.c}`:`v${VER.v}`
}
async function loadVersion(){
  try{
    const r=await fetch('/health')
    if(!r.ok)return
    const h=await r.json()
    VER.v=h.version||null; VER.c=h.commit||null
    // Pinta onde já estiver renderizado (a tela pode ter carregado antes).
    for(const id of ['lgv','tbv']){
      const el=$(id); if(el&&VER.v)el.textContent=verLabel()
    }
  }catch{/* versão é informativa; falhar aqui não pode travar o painel */}
}
let q='', filt=null, sort={c:'name',d:1}, evFilt=new Set()
let loading=false, timer=null, ctl=null, live=false, lastSeq=0

// Ícones das ações da linha. Traço de 1.6 para casar com o peso leve do painel.
const svg=(d,sz=15)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
  aria-hidden="true">${d}</svg>`
const AI={
  qr:svg('<rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM19 19h2v2h-2z"/>'),
  stop:svg('<rect x="5.5" y="5.5" width="13" height="13" rx="1.5"/>'),
  rst:svg('<path d="M3.5 12a8.5 8.5 0 1 0 8.5-8.5 8.5 8.5 0 0 0-6.3 2.8H3.5m0-3.8v3.8h3.8"/>'),
  del:svg('<path d="M4 6.5h16M9 6.5V4h6v2.5M6.5 6.5l1 13h9l1-13"/>'),
}

const $=i=>document.getElementById(i)
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const hms=t=>new Date(t).toLocaleTimeString('pt-BR',{hour12:false})
const nf=n=>Number(n||0).toLocaleString('pt-BR')

// Estado num só lugar: rótulo em português e a classe de cor contida.
const ST={
 WORKING:{l:'no ar',k:'a',c:'var(--sig)'},
 STARTING:{l:'iniciando',k:'z',c:'var(--t3)'},
 SCAN_QR_CODE:{l:'aguardando qr',k:'w',c:'var(--amb)'},
 FAILED:{l:'com falha',k:'e',c:'var(--red)'},
 STOPPED:{l:'parada',k:'z',c:'var(--t4)'},
}
const st=s=>ST[s]||ST.STOPPED

/**
 * Rótulo do estado, considerando se o gateway DESISTIU de reconectar.
 *
 * ★ O painel mostrava "com falha" tanto para a sessão que está reconectando sozinha
 * quanto para a que esgotou as tentativas e só volta com /restart humano. São estados
 * OPOSTOS em termos do que o operador deve fazer — um se resolve sozinho, o outro
 * exige ação — e tinham aparência idêntica. O resultado é o operador esperar por algo
 * que não vem, ou intervir sem necessidade.
 *
 * O backend já distinguia os dois casos (três caminhos de queda, mais um estado
 * terminal); só não expunha isso em campo consultável.
 */
function estado(s){
  const base=st(s.status)
  if(s.status!=='FAILED')return base
  return s.gaveUp
    ? {...base,l:'precisa reiniciar',t:'O gateway tentou reconectar e desistiu. Clique em reiniciar.'}
    : {...base,l:s.reconnectAttempts?`reconectando ${s.reconnectAttempts}/10`:'reconectando',
       t:'A conexão caiu e o gateway está tentando voltar sozinho.'}
}

/**
 * Pinta o SEGUNDO elo da marca com a cor do pior estado presente.
 *
 * Falha ganha de "aguardando QR": um canal com falha não volta sozinho, e o QR
 * expira e é regenerado — quem tem os dois precisa ver o vermelho, senão a falha
 * fica escondida atrás de uma condição que se resolve no próximo ciclo.
 *
 * A cor sai do mapa ST, a mesma dos contadores e das linhas. Duplicá-la aqui
 * criaria dois lugares para trocar quando o tema mudar — e um deles ficaria para
 * trás. Os estados que não pedem ação (no ar, iniciando, parada) devolvem null e
 * a marca volta ao verde inteira.
 */
function marcaAlerta(){
  if(sess.some(s=>s.status==='FAILED'))       return ST.FAILED.c
  if(sess.some(s=>s.status==='SCAN_QR_CODE')) return ST.SCAN_QR_CODE.c
  return null
}
/** Aplica o estado nas DUAS marcas (cabeçalho e tela de entrada, quando visível). */
function sinalizarMarca(){
  const cor=marcaAlerta()
  for(const el of document.querySelectorAll('.mk,.mk-lg')){
    // A cor vai numa custom property em vez de `stroke` direto: assim o CSS
    // decide como usá-la (traço E brilho do drop-shadow) sem o JS saber de
    // apresentação.
    if(cor){el.style.setProperty('--mk2',cor);el.classList.add('mk-alerta')}
    else   {el.style.removeProperty('--mk2');el.classList.remove('mk-alerta')}
  }
}
// Telefone legível com o país explícito, para nunca parecer que falta dígito.
//   558586479003  -> +55 85 8647-9003   (12 dig: número antigo, sem o nono)
//   5585986479003 -> +55 85 98647-9003  (13 dig: celular com o nono)
// Confirmado com o WhatsApp que as duas formas resolvem o MESMO chatId/LID —
// não há dígito perdido, é o próprio número que é de 12 dígitos.
const fone=p=>{
  const d=String(p||'').replace(/\D/g,'')
  if(!d)return '—'
  const br=d.startsWith('55')&&(d.length===12||d.length===13)
  if(!br)return '+'+d                       // fora do BR: mostra cru, sem chutar formato
  const n=d.slice(2)
  const loc=n.slice(2), mid=loc.length>=9?5:4
  return `+55 ${n.slice(0,2)} ${loc.slice(0,mid)}-${loc.slice(mid)}`
}

async function api(p,o={}){
  // Content-Type SÓ quando há corpo: declarar application/json num POST sem body
  // faz o Fastify responder 400 ("Body cannot be empty when content-type is set
  // to application/json"). Era o que quebrava as ações sem payload.
  const h={'X-Api-Key':KEY,...(o.headers||{})}
  if(o.body)h['Content-Type']='application/json'
  const r=await fetch(p,{...o,headers:h})
  if(r.status===401){logout();throw new Error('chave inválida')}
  const b=await r.json().catch(()=>({}))
  if(!r.ok)throw new Error(b.message||`HTTP ${r.status}`)
  return b
}

/**
 * Faz o contorno do cartão acender na direção do cursor.
 *
 * O listener fica no DOCUMENTO, não no cartão: preso ao cartão, o halo só
 * reagiria com o mouse JÁ sobre ele, e a borda mais próxima do cursor — que é o
 * ponto todo do efeito — nunca acenderia na aproximação. A posição é convertida
 * para coordenada relativa ao cartão, e pode ficar fora de 0–100%: é o que faz
 * o brilho girar pela moldura conforme o mouse contorna o quadro por fora.
 *
 * Escreve em `--mx/--my` dentro de requestAnimationFrame e no máximo uma vez por
 * quadro. `mousemove` dispara muito mais que 60x/s, e cada escrita numa custom
 * property usada por gradiente força repaint — sem o coalescing o efeito fica
 * mais caro que o resto da tela inteira.
 *
 * Respeita prefers-reduced-motion: quem pediu menos movimento não recebe um
 * brilho perseguindo o cursor.
 */
function ligarGlow(){
  const card=document.querySelector('.lg-c')
  if(!card)return
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return

  let alvo=null,agendado=false
  const pintar=()=>{
    agendado=false
    if(!alvo||!card.isConnected)return
    const r=card.getBoundingClientRect()
    if(!r.width||!r.height)return
    card.style.setProperty('--mx',((alvo.x-r.left)/r.width*100).toFixed(2)+'%')
    card.style.setProperty('--my',((alvo.y-r.top)/r.height*100).toFixed(2)+'%')
  }
  const mover=e=>{
    alvo={x:e.clientX,y:e.clientY}
    card.classList.add('glow-on')
    if(!agendado){agendado=true;requestAnimationFrame(pintar)}
  }
  document.addEventListener('mousemove',mover,{passive:true})
  // Ponteiro saiu da janela: o halo congelaria na última posição, parecendo
  // preso. Apaga e volta ao repouso (o CSS já centraliza no topo).
  document.addEventListener('mouseleave',()=>card.classList.remove('glow-on'),{passive:true})

  // ★ Remove o listener quando o cartão sai do DOM. Sem isso, cada logout()
  // registraria um mousemove novo no documento e o anterior seguiria vivo,
  // mexendo num nó órfão — vazamento que só aparece depois de vários
  // login/logout, quando a tela começa a engasgar sem motivo aparente.
  const obs=new MutationObserver(()=>{
    if(card.isConnected)return
    document.removeEventListener('mousemove',mover)
    obs.disconnect()
  })
  obs.observe(document.getElementById('app'),{childList:true,subtree:true})

  // Acende já, sem esperar o primeiro movimento (a tela abre viva).
  card.classList.add('glow-on')
}

function rows(){
  const l=$('lst'); if(!l)return
  if(!sess.length){
    l.innerHTML=`<div class="emp"><b>nenhuma sessão</b>
      <span>Crie a primeira em <i style="font-style:normal;color:var(--sig)">+ nova</i>.
      Use o nome que quiser — espaços, acentos e emoji são aceitos.</span></div>`
    return
  }
  let list=sess.filter(s=>{
    if(filt&&s.status!==filt)return false
    if(!q.trim())return true
    const t=q.toLowerCase()
    return (s.label||s.name).toLowerCase().includes(t)||s.name.toLowerCase().includes(t)||
      String(s.me?.id||'').includes(t)||String(s.me?.pushName||'').toLowerCase().includes(t)
  })
  const key=s=>({name:(s.label||s.name).toLowerCase(),status:s.status,
    phone:String(s.me?.id||''),msgs:stats[s.name]?.sent||0}[sort.c]??'')
  list.sort((a,b)=>{
    const x=key(a),y=key(b)
    return (typeof x==='number'?x-y:String(x).localeCompare(String(y),'pt-BR'))*sort.d
  })
  if(!list.length){
    l.innerHTML=`<div class="emp"><b>nada encontrado</b>
      <span>Ajuste a busca ou o filtro de estado.</span></div>`
    return
  }
  const th=(c,t,r)=>`<span class="s${sort.c===c?' on':''}${r?' r':''}" data-c="${c}">${t}${
    sort.c===c?(sort.d>0?' ↑':' ↓'):''}</span>`
  l.innerHTML=`<div class="hd"><span></span>${th('name','sessão')}${th('phone','número')}
    ${th('status','estado')}${th('msgs','msgs',1)}<span class="r">ações</span></div>
   ${list.map((s,i)=>row(s,i+1)).join('')}`
  l.querySelectorAll('.hd span.s').forEach(h=>h.onclick=()=>{
    const c=h.dataset.c; sort=sort.c===c?{c,d:-sort.d}:{c,d:1}; rows()
  })
  l.querySelectorAll('.rw').forEach(r=>{
    r.onclick=e=>{if(!e.target.closest('button'))detail(r.dataset.s)}
  })
  l.querySelectorAll('button[data-a]').forEach(b=>{
    b.onclick=e=>{e.stopPropagation();act(b.dataset.a,b.closest('.rw').dataset.s,b)}
  })
}

// ── Stream (fetch, não EventSource: precisamos do header X-Api-Key) ────────
async function stream(){
  if(ctl)ctl.abort(); ctl=new AbortController()
  try{
    const r=await fetch(`/api/events?after=${lastSeq}`,{headers:{'X-Api-Key':KEY},signal:ctl.signal})
    if(!r.ok||!r.body)throw new Error(`HTTP ${r.status}`)
    live=true; lvUp()
    const rd=r.body.getReader(), dc=new TextDecoder(); let buf=''
    for(;;){
      const {done,value}=await rd.read(); if(done)break
      buf+=dc.decode(value,{stream:true})
      const ps=buf.split('\n\n'); buf=ps.pop()||''
      for(const p of ps){
        const ln=p.split('\n').find(x=>x.startsWith('data: ')); if(!ln)continue
        try{
          const e=JSON.parse(ln.slice(6))
          evs.push(e); if(evs.length>600)evs.shift()
          lastSeq=Math.max(lastSeq,e.seq)
          if(view==='events')lg()
          if(e.kind==='session')load()
          if(e.level==='error')badge()
          // Alimenta o teste de canal aberto, se houver.
          ackDoTeste(e)
        }catch{}
      }
    }
  }catch(e){ if(e.name==='AbortError')return }
  live=false; lvUp()
  setTimeout(()=>{if(KEY)stream()},3000)
}
function lvUp(){
  const el=$('lv'); if(!el)return
  el.className=`tb-lv${live?'':' off'}`; el.textContent=live?'ao vivo':'off'
  if(view==='events')lg()
}
function badge(){
  const b=document.querySelector('.tb-nav button[data-v="events"]'); if(!b)return
  const n=evs.filter(e=>e.level==='error').length
  const ex=b.querySelector('.tb-n')
  if(n&&!ex)b.insertAdjacentHTML('beforeend',`<span class="tb-n">${n>99?'99+':n}</span>`)
  else if(n&&ex)ex.textContent=n>99?'99+':n
  else if(!n&&ex)ex.remove()
}

async function load(manual){
  if(loading)return; loading=true
  // Gira o próprio ícone em vez de trocar o conteúdo do botão: trocar fazia a
  // barra SALTAR de largura a cada atualização (o spinner tem outro tamanho).
  const rf=$('rf')
  if(manual&&rf){rf.classList.add('on');rf.disabled=true}
  try{
    const [s,k]=await Promise.all([
      api('/api/sessions'),
      api('/api/stats').catch(()=>({})),
      carregarBackup(),
    ])
    sess=s; stats=k
    // A marca sinaliza aqui, NÃO dentro do vSess(): o vSess só roda na aba de
    // sessões, e o operador que está na aba de eventos precisa ver o alerta
    // igual. Este ponto é comum a toda atualização.
    sinalizarMarca()
    if(view==='sessions')vSess(); else lg()
  }catch(e){toast('er','falha',e.message)}
  finally{
    loading=false
    const el=$('rf')
    if(manual&&el){el.classList.remove('on');el.disabled=false}
  }
}

/**
 * Faixa de aviso do backup.
 *
 * Só aparece quando há risco REAL: pareamento existente sem backup, ou backup
 * mais antigo que a última mudança de pareamento. Numa instalação nova (sem
 * sessão pareada) não há nada a perder — e mostrar aviso aí treinaria o operador
 * a ignorá-lo.
 */
function avisoBackup(){
  if(bkpOff||!bkp)return ''
  if(bkp.risk!=='no_backup'&&bkp.risk!=='stale')return ''
  const titulo=bkp.risk==='no_backup'?'sem backup':'backup desatualizado'
  return `<div class="wr">
    <b>${titulo}</b>
    <span>${esc(bkp.message)}</span>
    <button id="bkd">baixar backup</button>
    <button class="x" id="bkx" title="dispensar até recarregar">×</button>
  </div>`
}

/** Baixa o dump. O navegador salva o arquivo; o servidor registra o marco. */
async function baixarBackup(){
  const b=$('bkd')
  if(b){b.disabled=true;b.innerHTML='<span class="spn"></span>'}
  try{
    // fetch (não link direto) porque a rota exige o header X-Api-Key.
    const r=await fetch('/api/backup',{headers:{'X-Api-Key':KEY}})
    if(!r.ok)throw new Error(`HTTP ${r.status}`)
    const blob=await r.blob()
    const nome=(r.headers.get('Content-Disposition')||'').match(/filename="([^"]+)"/)?.[1]
      ||'elo-backup.json'
    const url=URL.createObjectURL(blob)
    const a=document.createElement('a')
    a.href=url; a.download=nome; a.click()
    // Revoga depois do clique: revogar antes cancela o download em alguns navegadores.
    setTimeout(()=>URL.revokeObjectURL(url),4000)
    toast('ok','backup baixado','guarde como guarda senha: contém as chaves do WhatsApp')
    await carregarBackup()
    if(view==='sessions')vSess()
  }catch(e){
    toast('er','falha no backup',e.message)
    if(b){b.disabled=false;b.innerHTML='baixar backup'}
  }
}

async function carregarBackup(){
  try{ bkp=await api('/api/backup/status') }catch{ bkp=null }
}

// ── Ações ──────────────────────────────────────────────────────────────────
/**
 * Ações que derrubam o canal pedem confirmação.
 *
 * ★ `stop` e `restart` executavam DIRETO no clique, em botão de 29px ao lado do de
 * remover. Parar um canal de atendimento em produção era um clique errado, sem rede
 * de proteção — enquanto `del` já confirmava. A inconsistência mostra que a lacuna
 * não era intencional.
 *
 * `start` não confirma: subir um canal não interrompe nada.
 */
const CONFIRMA={
  stop:{t:'parar sessão',b:'parar',
        m:'O canal fica FORA DO AR: para de receber e de enviar mensagem até ser iniciado de novo. O pareamento é preservado.'},
  restart:{t:'reiniciar sessão',b:'reiniciar',
        m:'A conexão cai e volta. Por alguns segundos o canal não recebe nem envia. O pareamento é preservado.'},
}
function confirmar(cfg,onSim){
  const o=modal(`<div class="md-h"><b>${cfg.t}</b><div class="sp"></div></div>
   <div class="md-b"><p style="font-size:13px;margin:0 0 12px">${esc(cfg.nome)}</p>
   <p class="fd-h" style="margin:0">${cfg.m}</p></div>
   <div class="md-a"><button id="n">cancelar</button><div class="sp"></div>
   <button id="y" class="d">${cfg.b}</button></div>`)
  o.querySelector('#n').onclick=()=>o.remove()
  o.querySelector('#y').onclick=()=>{o.remove();onSim()}
}

async function act(a,name,btn){
  if(a==='qr')return qr(name)
  if(a==='del')return del(name)
  // Confirma antes de derrubar o canal. O clique só chega ao servidor depois do "sim".
  if(CONFIRMA[a]&&!act._ok){
    return confirmar({...CONFIRMA[a],nome:nomeDe(name)},()=>{
      act._ok=true; act(a,name,btn).finally(()=>{act._ok=false})
    })
  }
  const lb={start:'iniciada',restart:'reiniciada',stop:'parada'}
  const old=btn?btn.innerHTML:null
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spn"></span>'}
  try{
    await api(`/api/sessions/${encodeURIComponent(name)}/${a}`,{method:'POST'})
    const s=sess.find(x=>x.name===name)
    toast('ok',lb[a],s?(s.label||s.name):name); setTimeout(load,1500)
  }catch(e){toast('er','falha na ação',e.message)}
  finally{if(btn){btn.disabled=false;btn.innerHTML=old}}
}
function modal(h,big){
  const o=document.createElement('div'); o.className='ov'
  o.innerHTML=`<div class="md${big?' lg':''}">${h}</div>`
  o.onclick=e=>{if(e.target===o)o.remove()}
  const k=e=>{if(e.key==='Escape'){o.remove();document.removeEventListener('keydown',k)}}
  document.addEventListener('keydown',k); document.body.appendChild(o); return o
}
const nomeDe=n=>{const s=sess.find(x=>x.name===n);return s?(s.label||s.name):n}

// Validade do QR do WhatsApp (~20s). Medimos que o Baileys emite um novo a cada
// ~14s, num ritmo irregular — por isso a contagem se apoia no `issuedAt` que o
// gateway informa, e não num cronômetro nosso.
const QR_TTL=20
const QR_POLL=2500
async function qr(name){
  const o=modal(`<div class="md-h"><b>conectar</b><span style="color:var(--t1)">${esc(nomeDe(name))}</span>
   <div class="sp"></div><button id="x">fechar</button></div>
   <div class="md-b"><span class="spn c"></span></div>`)
  let closed=false, left=QR_TTL, ivTick=null, ivPoll=null, done=false
  let lastData='', issuedAt=0
  const stop=()=>{closed=true;if(ivTick)clearInterval(ivTick);if(ivPoll)clearInterval(ivPoll)}
  const close=()=>{stop();o.remove()}
  o.querySelector('#x').onclick=close
  // Fechar pelo overlay/ESC também precisa parar os timers.
  const mo=new MutationObserver(()=>{if(!document.body.contains(o))stop()})
  mo.observe(document.body,{childList:true})

  // Retângulo de 286x286 num viewBox de 300 (inset de 7 para o traço de 3 não
  // vazar): perímetro = 4 lados menos o desconto dos cantos arredondados.
  // A aproximação basta — o dasharray só precisa cobrir o traço inteiro.
  const SIDE=286, RAD=6
  const C=4*(SIDE-2*RAD)+2*Math.PI*RAD
  const paint=()=>{
    const ring=o.querySelector('.qrr .fg'); if(!ring)return
    // Idade REAL a partir do instante de emissão informado pelo gateway.
    const age=issuedAt?(Date.now()-issuedAt)/1000:0
    left=Math.max(0,Math.ceil(QR_TTL-age))
    const frac=Math.max(0,Math.min(1,(QR_TTL-age)/QR_TTL))
    // pathLength=1000 no <rect> normaliza o perímetro, então trabalhamos em
    // milésimos e não dependemos da precisão do cálculo geométrico.
    ring.style.strokeDasharray='1000'
    ring.style.strokeDashoffset=String(Math.round(1000*(1-frac)))
    const urg=left<=5
    ring.classList.toggle('urg',urg)
    const t=o.querySelector('.qrt')
    if(t){
      t.classList.toggle('urg',urg)
      // Passou de 12s vencido: o WhatsApp deixou de emitir (acontece apos varias
      // rodadas sem ninguem escanear). Oferece a saida em vez de deixar um codigo
      // morto na tela para sempre.
      if(age>QR_TTL+12){
        t.classList.add('urg')
        t.innerHTML=`<b>código expirado</b> — <a href="#" id="qrrs"
          style="color:var(--sig);text-decoration:underline">gerar novo</a>`
        const b=t.querySelector('#qrrs')
        if(b)b.onclick=async e=>{
          e.preventDefault(); stop()
          o.querySelector('.md-b').innerHTML='<span class="spn c"></span>'
          try{
            await api(`/api/sessions/${encodeURIComponent(name)}/restart`,{method:'POST'})
            setTimeout(()=>{o.remove();qr(name)},2600)
          }catch(err){toast('er','falha ao reiniciar',err.message);o.remove()}
        }
      }else{
        t.innerHTML=left>0
          ?`código válido por <b>${left}s</b>`
          :`<b>aguardando novo código…</b>`
      }
    }
    const img=o.querySelector('.qr')
    if(img)img.classList.toggle('stale',left<=0)
  }

  // Busca o QR. Só reescreve a imagem quando o código MUDOU de fato — assim a
  // troca é visível (e o operador sabe que é um código novo), sem piscar a cada
  // verificação.
  const fetchQr=async()=>{
    if(closed||done)return
    try{
      const r=await api(`/api/${encodeURIComponent(name)}/auth/qr`,{headers:{Accept:'application/json'}})
      if(closed||done)return
      const first=!o.querySelector('.qrw')
      if(first){
        o.querySelector('.md-b').innerHTML=`
        <div class="qrw">
          <svg class="qrr" viewBox="0 0 300 300" aria-hidden="true">
            <rect class="bg" x="7" y="7" width="286" height="286" rx="6"/>
            <rect class="fg" x="7" y="7" width="286" height="286" rx="6"
              pathLength="1000"/>
          </svg>
          <img class="qr" src="data:image/png;base64,${r.data}" alt="QR code para conectar">
        </div>
        <p class="qrt" role="status"></p>
        <p class="qr-h">WhatsApp → <b>Aparelhos conectados</b> → <b>Conectar aparelho</b></p>`
      }else if(r.data!==lastData){
        // Código novo: troca a imagem com um leve pulso, para a renovação ser
        // perceptível em vez de silenciosa.
        const img=o.querySelector('.qr')
        img.src=`data:image/png;base64,${r.data}`
        img.classList.remove('stale')
        img.animate?.([{opacity:.45,transform:'scale(.985)'},{opacity:1,transform:'none'}],
          {duration:260,easing:'ease-out'})
      }
      lastData=r.data
      // A idade vem do gateway: `issuedAt` e o momento em que o WhatsApp emitiu.
      issuedAt=r.issuedAt||Date.now()
      paint()
    }catch(e){
      if(closed||done)return
      o.querySelector('.md-b').innerHTML=`<p style="font-size:12px;color:var(--t2);margin:0 0 10px">${esc(e.message)}</p>
        <p class="fd-h" style="margin:0">Sessão conectada não mostra QR.
        Para trocar de número, use <b style="color:var(--t2);font-weight:400">reiniciar</b>.</p>`
      stop()
    }
  }

  // Pareou: mostra a confirmação em vez de deixar o operador adivinhando.
  const success=(s)=>{
    if(done)return
    done=true; stop()
    const ph=s?.me?.id?fone(String(s.me.id).split('@')[0]):null
    o.querySelector('.md-b').innerHTML=`<div class="qrw"><div class="qrok">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>
      <b>conectada</b>
      <span>${ph?esc(ph):''}${s?.me?.pushName?`<br>${esc(s.me.pushName)}`:''}</span>
      </div></div>
      <p class="qrt" style="color:var(--sig)">pareamento concluído</p>`
    toast('ok','conectada',nomeDe(name))
    load()
    setTimeout(()=>{if(document.body.contains(o))close()},2600)
  }

  await fetchQr()

  // Tique de 1s: só repinta o anel. A renovação do código NÃO é cronometrada
  // aqui — quem manda é o WhatsApp, e o poll abaixo detecta a troca.
  ivTick=setInterval(paint,1000)

  // Poll único: busca o QR (detecta código novo) e o status (detecta pareamento).
  // Um só intervalo em vez de dois evita rajadas simultâneas de request.
  ivPoll=setInterval(async()=>{
    if(closed||done)return
    try{
      const st=await api(`/api/sessions/${encodeURIComponent(name)}`)
      if(st.status==='WORKING'){success(st);return}
      await fetchQr()
    }catch{/* transitório: o próximo tique tenta de novo */}
  },QR_POLL)
}

function del(name){
  const o=modal(`<div class="md-h"><b>remover sessão</b><div class="sp"></div></div>
   <div class="md-b"><p style="font-size:13px;margin:0 0 12px">${esc(nomeDe(name))}</p>
   <p class="fd-h" style="margin:0">O pareamento é apagado — será preciso escanear
   o QR novamente para reconectar.</p></div>
   <div class="md-a"><button id="n">cancelar</button><div class="sp"></div>
   <button id="y" class="d">remover</button></div>`)
  o.querySelector('#n').onclick=()=>o.remove()
  o.querySelector('#y').onclick=async()=>{
    const nm=nomeDe(name); o.remove()
    try{await api(`/api/sessions/${encodeURIComponent(name)}`,{method:'DELETE'})
      toast('ok','removida',nm);load()}
    catch(e){toast('er','falha ao remover',e.message)}
  }
}

// ── Nova sessão: nome livre, id técnico em preview ─────────────────────────
function slugPv(s){
  return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').replace(/-{2,}/g,'-')
    .slice(0,60).replace(/-+$/,'')
}
function newSess(){
  const o=modal(`<div class="md-h"><b>nova sessão</b><div class="sp"></div>
   <button id="x">fechar</button></div>
   <div class="md-b">
     <div class="fd">
       <label for="nm">nome</label>
       <input id="nm" placeholder="Ex: Comercial — Matriz" autocomplete="off">
       <div class="fd-p"><b>id gerado</b><i id="pv">—</i></div>
       <p class="fd-h">Escreva como preferir — espaços, acentos, emoji.
         O identificador técnico é derivado automaticamente.</p>
     </div>
     <div class="fd" style="margin-bottom:0">
       <label for="wh">webhook · opcional</label>
       <input id="wh" placeholder="https://…/webhook/zap" autocomplete="off">
       <p class="fd-h">Destino das mensagens recebidas. Vazio = apenas teste de conexão.</p>
       <div class="fd-e" id="e"></div>
     </div>
   </div>
   <div class="md-a"><button id="c">cancelar</button><div class="sp"></div>
     <button id="k" class="k">criar e conectar</button></div>`)
  const cl=()=>o.remove()
  o.querySelector('#x').onclick=cl; o.querySelector('#c').onclick=cl
  const nm=o.querySelector('#nm'), pv=o.querySelector('#pv')
  nm.oninput=()=>{
    const s=slugPv(nm.value)
    pv.textContent=s||(nm.value.trim()?'sessao-…':'—')
  }
  nm.focus()
  o.querySelector('#k').onclick=async()=>{
    const name=nm.value.trim(), wh=o.querySelector('#wh').value.trim()
    const er=o.querySelector('#e')
    if(!name){er.textContent='informe um nome';return}
    const body={name,start:true}
    if(wh)body.config={webhooks:[{url:wh,events:['message','message.ack','session.status'],
      customHeaders:[{name:'X-Webhook-Key',value:KEY}],
      retries:{attempts:15,delaySeconds:2,policy:'constant'}}]}
    try{
      const r=await api('/api/sessions',{method:'POST',body:JSON.stringify(body)})
